[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sllkgui"
dynamic = ["version"]
description = "基于 PySide6 的开源 UI 基座：窗口框架、组件库、主题、语言与插件加载"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "SllkGUI Contributors" }]
keywords = ["pyside6", "qt", "ui", "desktop", "widgets", "theme", "plugin", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 基座核心代码在其它桌面平台可运行（亚克力 / 托盘 / 修饰键降级，见
    # tests/test_cross_platform.py）；仅 Windows 启动器是平台特化的，不随 wheel 分发。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
    "Typing :: Typed",
]
dependencies = [
    "pyside6>=6.10.1,<7",
    "pyyaml>=6.0.3,<7",
    "packaging>=24",
]

# 开发期工具统一由 dev extra 提供（CI 用 uv sync --extra dev，本地同样用 --extra dev）；
# 不要在 [dependency-groups].dev 重复声明，避免两处版本口径漂移。
[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4.0",
    "mypy>=1.13",
    "ruff>=0.11.2",
    "pre-commit>=3.8",
    "build>=1.2",
]

[project.urls]
Homepage = "https://gitee.com/shilianlvke/SllkGui"
Repository = "https://gitee.com/shilianlvke/SllkGui"
Issues = "https://gitee.com/shilianlvke/SllkGui/issues"
Changelog = "https://gitee.com/shilianlvke/SllkGui/blob/main/CHANGELOG.md"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
sllkgui = "sllkgui.cli:main"

[tool.hatch.version]
path = "src/sllkgui/_version.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
# 与 ruff lint 同源，零额外依赖；取代曾经的 black（其默认 88 列与本项目
# 的 120 列不符，仓库里也从未真正用它格式化过）。
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "TID252"]

[tool.ruff.lint.per-file-ignores]
# 示例脚本必须在导入 Qt / sllkgui 之前写入演示目录环境变量，导入顺序即语义。
"examples/hello_world/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本地 pytest 默认与 CI 同门槛：全量覆盖率 + 71% 下限（pytest-cov 由 dev extra 提供）。
addopts = "-q --cov=sllkgui --cov-report=term-missing --cov-fail-under=71"

[tool.coverage.run]
source = ["sllkgui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# 类型检查采用"分层门禁"：约束**下游插件作者直接依赖**的那一层，
# 组件库内部实现暂不纳入。
#
# 纳入范围 = 公开门面 + 插件协议 + 设置协议 + 用户配置存储：
#   - sllkgui.plugin / sllkgui.window：插件与宿主作者的唯一入口
#   - gallery.api / manifest / context / errors：插件协议本身
#   - gallery.storage / events / services：插件协议新增能力（随实现批次加入 files）
#   - appcore.settings：插件声明设置页用的 schema
#   - appcore.user_settings / config.py：用户配置的读写契约
#   - guicore.callbacks / task：插件可用的异步与回调工具
#
# 不纳入范围：guicore 的 2.9 万行组件实现——历史欠账主要是 PySide6 stub
# 缺口（Qt.UserRole 之类）与未声明的实例属性，属于注解补全而非真实缺陷，
# 一次性收敛不现实。组件库对外仍提供运行时正确的实现，但不承诺类型完备。
#
# 下游若在自己的代码里对 sllkgui 做严格类型检查，可用 py.typed 获得
# 上述公开 API 的类型信息；组件内部的类型精度不在承诺范围内。
[tool.mypy]
python_version = "3.12"
files = [
    "src/sllkgui/plugin.py",
    "src/sllkgui/window.py",
    "src/sllkgui/config.py",
    "src/sllkgui/gallery/api.py",
    "src/sllkgui/gallery/context.py",
    "src/sllkgui/gallery/errors.py",
    "src/sllkgui/gallery/manifest.py",
    "src/sllkgui/gallery/storage.py",
    "src/sllkgui/gallery/events.py",
    "src/sllkgui/gallery/services.py",
    "src/sllkgui/appcore/settings",
    "src/sllkgui/appcore/user_settings.py",
    "src/sllkgui/guicore/callbacks.py",
    "src/sllkgui/guicore/task.py",
    # 2.9 万行组件实现的类型覆盖分批推进：先纳入已治理的横切模块。
    "src/sllkgui/guicore/shortcuts.py",
    "src/sllkgui/guicore/_shortcut_parsing.py",
    "src/sllkgui/guicore/custom_ui/config_helpers.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = false

[tool.hatch.build.targets.sdist]
include = ["src/sllkgui", "examples", "docs", "tests", "scripts"]

[tool.hatch.build.targets.wheel]
packages = ["src/sllkgui"]
