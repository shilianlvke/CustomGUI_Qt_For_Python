[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "customgui"
dynamic = ["version"]
description = "基于 PySide6 的开源 UI 基座：窗口框架、组件库、主题、语言与插件加载。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.10.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
windows-hardware = [
    "pyserial>=3.5; platform_system == 'Windows'",
    "hidapi>=0.14.0; platform_system == 'Windows'",
    "wmi>=1.5.1; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.2",
    "black",
    "pyinstaller>=6.22.3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.version]
path = "customgui/_version.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID252"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["AppCore", "GuiCore", "Guis", "customgui"]
