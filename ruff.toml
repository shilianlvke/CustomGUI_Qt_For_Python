line-length = 120
target-version = "py312"

[lint]
# 严格模式：启用 Ruff 全规则。
select = ["ALL"]
ignore = ["D203", "D213", "D400", "D415", "RUF001", "RUF002", "RUF003", "COM812"]

[lint.per-file-ignores]
# pydantic 校验器强制 raise ValueError，此处豁免消息风格规则。
"AppCore/system/module/token_models.py" = ["TRY003", "EM101"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
