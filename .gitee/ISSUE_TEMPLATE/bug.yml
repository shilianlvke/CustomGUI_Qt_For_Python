name: 缺陷报告
description: 报告可复现的缺陷
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认问题在最新版上仍能复现。

        **填写前建议先跑一次 `sllkgui doctor`**，把输出贴到「环境信息」里，
        能省掉一轮来回询问。

  - type: input
    id: version
    attributes:
      label: 基座版本
      placeholder: "3.0.0（执行 `sllkgui doctor` 可看到）"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - 组件展厅（sllkgui gallery）
        - 正式模式（sllkgui run）
        - 仅插件开发
        - 其它
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: 涉及的插件 ID
      description: 若与插件有关，请填写清单里的 id（如 com.example.my-plugin）；与插件无关可填「无」
      placeholder: com.example.my-plugin

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 编号列出，从头开始，每步都要能让读者复现
      placeholder: |
        1. 执行 `sllkgui gallery`
        2. 点击左菜单的「数据展示」
        3. 观察到窗口空白
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 错误信息请贴完整堆栈
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        日志目录默认在程序根目录的 `logs/` 下；也可贴 `sllkgui doctor` 的输出。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认问题在最新版上仍能复现
          required: true
        - label: 我已搜索过现有 issue，没有重复
          required: true
