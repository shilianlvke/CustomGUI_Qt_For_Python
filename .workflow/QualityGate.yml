# =============================================================================
# Gitee Go 原生流水线：质量门禁（QualityGate）
# =============================================================================
# 【文件位置】仓库根目录 .workflow/ 下（Gitee Go 只读取该目录的 YAML）。
# 【触发】向 main 提 PR、或 main 分支有推送时自动执行；也可在平台手动运行。
# 【流程】ruff（项目规则集）→ pytest（无头运行）。
# 【与 ReleasePipeline 的分工】
#   发布流水线只在打 v* tag 时触发，负责打包与产物暂存，一条要跑好几分钟；
#   本流水线**不构建任何产物**，只回答「这次改动能不能进 main」，一分钟内出结果。
#   两者共用 pyproject.toml 里的 ruff 规则集与 pytest 配置，避免本地与 CI 打架。
# =============================================================================

# 当前 yml 文件版本（固定）
version: '1.0'
# 流水线唯一标识（仓库内唯一）
name: quality-gate
# 流水线展示名称（支持中文）
displayName: 质量门禁

# 触发规则：main 的 PR 与 main 的推送
triggers:
  push:
    branches:
      # precise = 精确匹配完整分支名，不监听其它分支，避免每次推都占用构建机
      precise:
        - main
  pr:
    branches:
      precise:
        - main

# 阶段定义
stages:
  - name: quality_check
    displayName: 代码质量检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: lint_and_test
        displayName: ruff 与 pytest
        # 平台内置最高 3.9，仅用于引导 uv（实际解释器为 3.13）
        pythonVersion: 3.9
        commands:
          # ---- 依赖与解释器 ----
          # 容器内 pip 以 user 模式安装，uv 落在 ~/.local/bin，必须加入 PATH；
          # Gitee Go 会把每条 command 单独引号包裹执行，命令必须写成单行。
          - python3 -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - python3 -m pip install uv
          - export PATH="$HOME/.local/bin:$PATH"
          - uv python install 3.13
          - uv venv --python 3.13
          # uv.lock 必须提交到版本库：它锁定精确依赖版本，保证 CI 可复现。
          # --locked 在 lock 与 pyproject.toml 不一致时直接报错，不会静默重新解析
          # ——否则「改了 pyproject 却忘了 uv lock」会悄悄通过门禁。
          - uv lock --check
          - uv sync --extra dev --locked
          # ---- 质量检查 ----
          # ruff 不带 --select，直接用 pyproject.toml 的 E/F/W/I/UP/B 规则集。
          # 全仓检查：examples 是用户入口，不能只检查 src/tests。
          # （曾写 apps，但该目录不存在，ruff 会因路径缺失直接失败。）
          - uv run ruff check src tests examples scripts
          # 格式门禁：ruff format 与 ruff 同源，零额外依赖。
          # --check 只报告不改动，CI 里绝不自动改文件。
          - uv run ruff format --check src tests examples scripts
          # 增量类型门禁：只约束下游直接依赖的公开 API 层
          # （见 pyproject 的 [tool.mypy]，含承诺范围说明）。
          - uv run mypy
          # pytest 的 offscreen 由 tests/conftest.py 统一设置，无需虚拟显示。
          # 覆盖率阈值贴当前基线（实测 71%，门禁 71% 防回退）；
          # -rf 在失败时输出失败用例清单，便于 PR 里直接定位。
          - uv run pytest --cov=sllkgui --cov-report=term-missing --cov-fail-under=71 -rf
          # ---- 跨平台降级冒烟 ----
          # CI 只有 Linux runner；这里验证的是非 Windows 上亚克力 / 托盘 /
          # 修饰键的**降级路径**，确保基座不会在非 Windows 直接崩。
          # 覆盖边界：Windows 特化分支本身（真实亚克力 / 系统托盘 / 修饰键
          # 行为）没有 CI 覆盖，只能在 Windows 本地跑 pytest 验证；本流水线
          # 不声称覆盖这些分支（详见 README §2 与 docs/MANUAL_QA.md）。
          - uv run pytest -q tests/test_cross_platform.py
          # ---- 打包冒烟 ----
          # 安装 wheel 后从仓库根运行：确认包内资源、配置上下文与 QSS 构建可用。
          # --no-deps 避免重复下载 PySide6；运行依赖已由上面的 uv sync 安装。
          - uv build
          - uv pip install --reinstall --no-deps dist/sllkgui-*.whl
          - .venv/bin/python scripts/wheel_smoke.py
