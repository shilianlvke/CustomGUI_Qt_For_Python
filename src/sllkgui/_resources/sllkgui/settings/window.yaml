# WINDOW SIZE 窗口大小
startup_size: # 初始化窗口大小
  - 1440
  - 900
minimum_size: # 最小窗口大小
  - 1440
  - 900

# ICON SIZE 图标大小
icon_size: 16

# CUSTOM WINDOW
custom_title_bar: True # 自定义标题栏
hide_grips: True # 隐藏调试边界
window_margin: 2
window_space: 2
window_border_size: 1
window_border_radius: 8
window_shadow: True
title_bar_margin: 10 # 非亚克力模式下标题栏外圈留白
content_margin: 10 # 非亚克力模式下主界面外圈留白

# GRIPS 窗口缩放夹点
grips:
  corner_size: 15 # 四角夹点尺寸
  corner_offset: 5 # 四角夹点内边距
  corner_inset: 20 # 右/下夹点相对边缘的缩进
  edge_size: 10 # 四边夹点厚度

# SHADOW 窗口外阴影
shadow:
  blur_radius: 20 # 模糊半径
  alpha: 160 # 阴影不透明度（0-255）
  offset_x: 0 # 水平偏移
  offset_y: 0 # 垂直偏移

# GLASS 玻璃层不透明度（0-1，仅在原生亚克力可用时生效）
# 数值越大越接近实色：太大看不到模糊，太小会牺牲文字可读性。
glass:
  window: 0.24 # 窗口底色
  sidebar: 0.0 # 侧栏底色
  panel: 0.0 # 面板底色
  region: 0.34 # 内容区域
  card: 0.34 # 卡片
  control: 0.22 # 输入类控件
  menu: 0.92 # 菜单/浮层
  overlay_panel: 0.96 # 抽屉面板
  tooltip: 0.92 # 工具提示

# MENU OVERLAY 左菜单浮层遮罩
menu_overlay:
  scrim_alpha_dark: 80 # 深色主题遮罩不透明度（0-255）
  scrim_alpha_light: 52 # 浅色主题遮罩不透明度（0-255）
  duration: 160 # 遮罩淡入淡出时长（毫秒）

# SCROLL TOP 滚动回顶按钮
scroll_top:
  size: 36 # 按钮直径
  margin: 16 # 距视口右下角间距
  threshold: 32 # 滚动超过该值后显示
  fade_duration: 160 # 淡入淡出时长（毫秒）
  scroll_duration: 320 # 回顶滚动时长（毫秒）


# ACRYLIC 亚克力材质（Windows 11 Fluent Design；其它平台自动回落为不透明主题底色）
acrylic:
  enabled: True # 是否启用系统级背景模糊
  opacity: 60 # 色调不透明度（0-100，越小越通透）
  fade_in: 160 # 窗口首次显示淡入时长（毫秒，0 为关闭）

# LEFT MENU
lef_menu_size: # 左侧菜单大小✅
  minimum: 50
  maximum: 200
left_menu_content_margins: 2 # 左侧菜单边距✅
left_column_size: # 左侧菜单页大小
  minimum: 0
  maximum: 240

# RIGHT MENU
right_column_size: # 右侧菜单页大小（外观配置页需要更大的可用宽度）
  minimum: 0
  maximum: 360
right_menu_content_margins: 3 # 左侧菜单边距✅
right_title_bar_height: 40
right_content_space: 6
right_credits_height: 40

# TOP / BOTTOM COLUMN 顶部与底部抽屉
top_column_size: # 顶部抽屉高度区间
  minimum: 0
  maximum: 240
bottom_column_size: # 底部抽屉高度区间
  minimum: 0
  maximum: 240
# CREDITS BAR
custom_padding: 12
custom_border: 2

# TOOLTIP
tooltip_border_radius: 8
tooltip_font: 400

# ANIMATION
time_animation: 200 # 动画时长

# PAGE TRANSITION 栏目切换动画（毫秒，按下面四段串联；任一段为 0 则跳过，全 0 为瞬切）
page_transition:
  page_out: 100 # 原页面从右侧向左侧擦除
  menu_out: 100 # 原栏目按钮高亮 1 -> 0
  menu_in: 100 # 目标栏目按钮高亮 0 -> 1
  page_in: 100 # 目标页面从左向右展开
  easing: InOutQuad # 各阶段缓动（QEasingCurve 枚举名）

# FEEDBACK 消息通知与骨架屏（毫秒 / 像素）
feedback:
  toast_life: 3000 # 通知停留时长
  toast_max: 4 # 同屏最多条数
  toast_duration: 180 # 进出动画时长
  toast_margin: 20 # 距窗口边缘距离
  toast_spacing: 8 # 通知之间的间距
  toast_width: 340 # 单条通知宽度
  toast_shadow: 5 # 通知外阴影占用的边距
  message_icon_size: 20 # 消息条图标尺寸
  skeleton_duration: 1400 # 骨架微光扫过一圈的时长

# OVERLAY 对话框与抽屉（毫秒 / 0-255）
overlay:
  dialog_duration: 160 # 对话框淡入淡出
  drawer_duration: 200 # 抽屉滑入滑出
  mask_alpha: 120 # 遮罩压暗程度

# PANELS 面板/标签/折叠（毫秒 / 像素）
panels:
  tab_duration: 180 # 标签指示条滑动
  collapse_duration: 180 # 手风琴/面板展开收起
  splitter_handle: 8 # 分隔条宽度
  splitter_grip: 28 # 分隔条握把长度
  radius: 8 # 面板圆角半径
  accordion_header_height: 44 # 手风琴标题栏高度
  fieldset_border_top: 10 # Fieldset 顶部留白
  fieldset_legend_height: 20 # Fieldset 图例高度
  fieldset_legend_gap: 6 # Fieldset 图例与内容间距
  tabs_close_width: 20 # 标签页关闭按钮宽度
  tabs_icon_gap: 7 # 标签页图标与文字间距

# BUTTON 按钮交互（毫秒 / 像素 / 0-1）
button:
  hover_duration: 120 # Fluent 控件状态切换比 Aura 更快
  radius: 4 # Fluent 标准控件圆角
  icon_gap: 8 # 图标与文字间距
  spin_period: 1600 # 加载指示器旋转一圈时长
  spin_interval: 16 # 加载指示器刷新间隔
  disabled_opacity: 0.38 # Fluent 禁用态内容不透明度

# FONT
family: Segoe UI Variable
title_size: 15 # 标题大小（约 20px）
subtitle_size: 11 # 副标题大小（约 15px）
text_size: 10 # 正文大小（约 13px）
